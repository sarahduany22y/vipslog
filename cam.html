<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Lives VIP 🔥</title>
  <link rel="stylesheet" href="estilo-telegram.css">
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>Gravados de Lives 🔥</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- Seletor de Abas -->
    <div class="tabs-container">
      <button id="tab-videos" class="tab-btn active" onclick="alternarAba('videos')">📹 Vídeos</button>
      <button id="tab-fotos" class="tab-btn" onclick="alternarAba('fotos')">🖼️ Fotos</button>
    </div>

    <!-- Container do Feed -->
    <div id="feed-container" class="telegram-feed"></div>

    <!-- Controles de Paginação -->
    <div id="pagination-controls" class="pagination-container"></div>
  </main>

  <!-- Scripts dos Links -->
  <script src="links-lives.js"></script>
  <script src="links-fotos-lives.js"></script>

  <!-- Script Principal -->
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      iniciarCategoria('lives', window.linksLives, window.linksFotosLives);
    });
  </script>
</body>
</html>
