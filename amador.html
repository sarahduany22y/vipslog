<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Amador VIP 🔞</title>
  <link rel="stylesheet" href="estilo-telegram.css">
  <style>
    .header-page {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 650px;
      margin: 0 auto 15px;
      width: 100%;
    }
    .header-page h2 {
      font-size: 1.2rem;
      color: #64b5ef;
    }
    .btn-voltar {
      color: #fff;
      text-decoration: none;
      background: #242f3d;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #2b3a4c;
    }
  </style>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>Galeria Amador Exclusiva 🔞</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- Container dos Vídeos da Categoria -->
    <div id="feed-container" class="telegram-feed"></div>

    <!-- Controles de Paginação -->
    <div id="pagination-controls" class="pagination-container"></div>
  </main>

  <!-- Script com os Links de Vídeo -->
  <script src="links-amador.js"></script>

  <!-- Motor da Paginação Estilo Telegram -->
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      iniciarCategoria('amador', window.linksAmador);
    });
  </script>
</body>
</html>
