<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Amador VIP 🔞</title>
  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    .tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }

    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px;
      background: #17212b;
      color: #7f91a4;
      border: 1px solid #242f3d;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #202b36;
      color: #fff;
    }

    .tab-btn.active {
      background: #24a1de;
      color: #fff;
      border-color: #24a1de;
    }

    .media-card {
      margin-bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .media-card img {
      width: 100%;
      max-width: 600px;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
    }

    /* PLACEHOLDER COM THUMBNAIL DE FUNDO */
    .video-placeholder {
      width: 100%;
      height: 450px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #242f3d;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    /* Camada escura por cima da thumb para destacar o botão */
    .video-placeholder::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      transition: background 0.3s;
    }

    .video-placeholder:hover::before {
      background: rgba(0, 0, 0, 0.2);
    }

    .play-btn-icon {
      position: relative;
      z-index: 2;
      width: 65px;
      height: 65px;
      background: #24a1de;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s;
    }

    .video-placeholder:hover .play-btn-icon {
      transform: scale(1.1);
    }

    .play-btn-icon::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 18px solid #fff;
      margin-left: 4px;
    }

    .play-txt {
      position: relative;
      z-index: 2;
      color: #fff;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .media-card iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 12px;
    }
  </style>

  <!-- TRAVA DE SEGURANÇA SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xjvkyofktqojuyequuxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__w-crANhzjiYKJuh2AX39w_Kz1-Rf74';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async function protegerAcesso() {
      document.documentElement.style.display = 'none';

      const { data: { session } } = await _supabase.auth.getSession();

      if (!session) {
        alert("Você precisa estar logado para acessar esta galeria.");
        window.location.href = 'index.html';
        return;
      }

      const { data: compras, error } = await _supabase
        .from('compras_usuario')
        .select('data_expiracao')
        .eq('user_id', session.user.id)
        .eq('categoria_id', 'amador');

      if (error || !compras || compras.length === 0) {
        alert("Você não possui acesso a esta galeria.");
        window.location.href = 'index.html';
        return;
      }

      const agora = new Date();
      const temAcessoValido = compras.some(item => new Date(item.data_expiracao) > agora);

      if (!temAcessoValido) {
        alert("Seu plano para esta galeria expirou.");
        window.location.href = 'index.html';
        return;
      }

      document.documentElement.style.display = 'block';
    })();
  </script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>🔞Galeria Amador🔞</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <div class="tabs-container">
      <button id="tab-amador" class="tab-btn active" onclick="alternarAba('amador')">📹 Amador - vazados - incesto</button>
      <button id="tab-omegle" class="tab-btn" onclick="alternarAba('omegle')">🎥 OmegleDark</button>
      <button id="tab-funk" class="tab-btn" onclick="alternarAba('funk')">🔥 Funk Proibidão</button>
      <button id="tab-tiktok" class="tab-btn" onclick="alternarAba('tiktok')">🎵 TikTok +18</button>
      <button id="tab-fotos" class="tab-btn" onclick="alternarAba('fotos')">🖼️ Fotos + vazadas</button>
    </div>

    <div id="feed-container" class="telegram-feed"></div>
    <div id="pagination-controls" class="pagination-container"></div>
  </main>

  <script src="links-amador.js"></script>
  <script src="links-omegle.js"></script>
  <script src="links-funk.js"></script>
  <script src="links-tiktok.js"></script>
  <script src="links-flagras.js"></script>
  <script src="links-fotos-amador.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const subcategoriasAmador = {
        amador: window.linksAmador || [],
        omegle: window.linksOmegle || [],
        funk: window.linksFunk || [],
        tiktok: window.linksTiktok || [],
        flagras: window.linksFlagras || [],
        fotos: window.linksFotosAmador || []
      };

      let abaAtual = 'amador';
      let paginaAtual = 1;
      const ITENS_POR_PAGINA = 15;
      let containerAtivo = null;

      // Função auxiliar para gerar a URL da Thumbnail da Bunny.net
      function obterThumbUrl(urlVideo) {
        if (urlVideo.includes('iframe.mediadelivery.net/embed/')) {
          return urlVideo.replace('/embed/', '/thumbnail.jpg?thumbnail=true');
        }
        return '';
      }

      window.alternarAba = function(subcat) {
        abaAtual = subcat;
        paginaAtual = 1;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const btnAtivo = document.getElementById(`tab-${subcat}`);
        if (btnAtivo) btnAtivo.classList.add('active');

        renderizarFeed();
      };

      window.carregarVideoUnico = function(el, url) {
        if (containerAtivo && containerAtivo !== el) {
          const oldUrl = containerAtivo.getAttribute('data-url');
          const oldThumb = obterThumbUrl(oldUrl);
          containerAtivo.innerHTML = `
            <div class="video-placeholder" style="background-image: url('${oldThumb}');" onclick="carregarVideoUnico(this.parentElement, '${oldUrl}')">
              <div class="play-btn-icon"></div>
              <span class="play-txt">Clique para assistir</span>
            </div>
          `;
        }

        const separator = url.includes('?') ? '&' : '?';
        el.innerHTML = `<iframe src="${url}${separator}autoplay=true" allow="autoplay" allowfullscreen></iframe>`;
        containerAtivo = el;
      };

      function renderizarFeed() {
        containerAtivo = null;
        const container = document.getElementById('feed-container');
        const paginationControls = document.getElementById('pagination-controls');
        const lista = subcategoriasAmador[abaAtual] || [];

        if (!container) return;

        if (lista.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#fff; padding: 20px;">Nenhum conteúdo nesta aba.</p>';
          if (paginationControls) paginationControls.innerHTML = '';
          return;
        }

        const totalPaginas = Math.ceil(lista.length / ITENS_POR_PAGINA);
        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const fim = inicio + ITENS_POR_PAGINA;
        const itensPagina = lista.slice(inicio, fim);

        container.innerHTML = itensPagina.map(url => {
          if (abaAtual === 'fotos' || url.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i)) {
            return `
              <div class="media-card">
                <img src="${url}" loading="lazy" alt="Foto Galeria" />
              </div>
            `;
          } else {
            const thumbUrl = obterThumbUrl(url);
            return `
              <div class="media-card" data-url="${url}">
                <div class="video-placeholder" style="background-image: url('${thumbUrl}');" onclick="carregarVideoUnico(this.parentElement, '${url}')">
                  <div class="play-btn-icon"></div>
                  <span class="play-txt">Clique para assistir</span>
                </div>
              </div>
            `;
          }
        }).join('');

        if (paginationControls && totalPaginas > 1) {
          let btnHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 20px 0;">`;
          if (paginaAtual > 1) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual - 1})">← Anterior</button>`;
          }
          btnHTML += `<span style="color:#fff; font-weight:bold;">Página ${paginaAtual} de ${totalPaginas}</span>`;
          if (paginaAtual < totalPaginas) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual + 1})">Próxima →</button>`;
          }
          btnHTML += `</div>`;
          paginationControls.innerHTML = btnHTML;
        } else if (paginationControls) {
          paginationControls.innerHTML = '';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.mudarPagina = function(novaPagina) {
        paginaAtual = novaPagina;
        renderizarFeed();
      };

      renderizarFeed();
    });
  </script>
</body>
</html>
