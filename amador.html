<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Amador VIP 🔞</title>
  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    /* BOTOES DAS ABAS */
    .tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }

    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px;
      background: #17212b;
      color: #7f91a4;
      border: 1px solid #242f3d;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #202b36;
      color: #fff;
    }

    .tab-btn.active {
      background: #24a1de;
      color: #fff;
      border-color: #24a1de;
    }

    /* GRID RESPONSIVO ESTILO PORNHUB/XVIDEOS */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* Padrão Desktop: 2 Colunas */
      gap: 15px;
      padding: 10px;
      max-width: 1000px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    @media (min-width: 900px) {
      .video-grid {
        grid-template-columns: repeat(3, 1fr); /* Notebook/PC grande: 3 Colunas */
      }
    }

    @media (max-width: 600px) {
      .video-grid {
        grid-template-columns: 1fr; /* Celular: Exatamente 1 Coluna */
        padding: 5px;
      }
    }

    /* CARDS INDIVIDUAIS DOS VÍDEOS */
    .media-card {
      background: #17212b;
      border: 1px solid #242f3d;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .media-card:hover {
      border-color: #24a1de;
    }

    /* CONTAINER DO VÍDEO/CAPA (PROPORÇÃO 16:9) */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
    }

    .video-wrapper img.thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ÍCONE DE PLAY NO CENTRO DA CAPA */
    .play-btn-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: rgba(36, 161, 222, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ESTILO PARA ABA DE FOTOS */
    .media-card img.foto-galeria {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }
  </style>

  <!-- TRAVA DE SEGURANÇA SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xjvkyofktqojuyequuxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__w-crANhzjiYKJuh2AX39w_Kz1-Rf74';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async function protegerAcesso() {
      document.documentElement.style.display = 'none';

      const { data: { session } } = await _supabase.auth.getSession();

      if (!session) {
        alert("Você precisa estar logado para acessar esta galeria.");
        window.location.href = 'index.html';
        return;
      }

      const { data: compras, error } = await _supabase
        .from('compras_usuario')
        .select('data_expiracao')
        .eq('user_id', session.user.id)
        .eq('categoria_id', 'amador');

      if (error || !compras || compras.length === 0) {
        alert("Você não possui acesso a esta galeria.");
        window.location.href = 'index.html';
        return;
      }

      const agora = new Date();
      const temAcessoValido = compras.some(item => new Date(item.data_expiracao) > agora);

      if (!temAcessoValido) {
        alert("Seu plano para esta galeria expirou.");
        window.location.href = 'index.html';
        return;
      }

      document.documentElement.style.display = 'block';
    })();
  </script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>🔞Galeria Amador🔞</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- SELETOR DE MÚLTIPLAS ABAS -->
    <div class="tabs-container">
      <button id="tab-amador" class="tab-btn active" onclick="alternarAba('amador')">📹 Amador - vazados - incesto</button>
      <button id="tab-omegle" class="tab-btn" onclick="alternarAba('omegle')">🎥 OmegleDark</button>
      <button id="tab-funk" class="tab-btn" onclick="alternarAba('funk')">🔥 Funk Proibidão</button>
      <button id="tab-tiktok" class="tab-btn" onclick="alternarAba('tiktok')">🎵 TikTok +18</button>
      <button id="tab-fotos" class="tab-btn" onclick="alternarAba('fotos')">🖼️ Fotos + vazadas</button>
    </div>

    <!-- Container em Grade/Grid -->
    <div id="feed-container" class="video-grid"></div>

    <!-- Controles de Paginação -->
    <div id="pagination-controls" class="pagination-container"></div>
  </main>

  <!-- SCRIPTS DOS LINKS DE MÍDIA -->
  <script src="links-amador.js"></script>
  <script src="links-omegle.js"></script>
  <script src="links-funk.js"></script>
  <script src="links-tiktok.js"></script>
  <script src="links-flagras.js"></script>
  <script src="links-fotos-amador.js"></script>

  <!-- SCRIPT PRINCIPAL DA APLICAÇÃO -->
  <script src="app.js"></script>

  <!-- SCRIPT DE NAVEGAÇÃO, THUMBNAILS E PAGINAÇÃO -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const subcategoriasAmador = {
        amador: window.linksAmador || [],
        omegle: window.linksOmegle || [],
        funk: window.linksFunk || [],
        tiktok: window.linksTiktok || [],
        flagras: window.linksFlagras || [],
        fotos: window.linksFotosAmador || []
      };

      let abaAtual = 'amador';
      let paginaAtual = 1;
      const ITENS_POR_PAGINA = 10; // Mantido 10 itens por página

      window.alternarAba = function(subcat) {
        abaAtual = subcat;
        paginaAtual = 1;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const btnAtivo = document.getElementById(`tab-${subcat}`);
        if (btnAtivo) btnAtivo.classList.add('active');

        renderizarFeed();
      };

      // EXTRAI A THUMBNAIL PADRÃO DO BUNNY STREAM
      function obterThumbnailBunny(urlIframe) {
        if (typeof urlIframe === 'string' && urlIframe.includes('iframe.mediadelivery.net')) {
          const partes = urlIframe.split('/');
          const libraryId = partes[4];
          const videoId = partes[5] ? partes[5].split('?')[0] : null;
          if (libraryId && videoId) {
            return `https://vz-${libraryId}.b-cdn.net/${videoId}/thumbnail.jpg`;
          }
        }
        return null;
      }

      // INICIA O PLAYER AO CLICAR E PAUSA OS DEMAIS
      window.iniciarPlayer = function(wrapper, url) {
        document.querySelectorAll('.video-wrapper iframe').forEach(iframe => {
          iframe.src = iframe.src;
        });

        const urlComAutoplay = url.includes('?') ? `${url}&autoplay=true` : `${url}?autoplay=true`;
        wrapper.innerHTML = `<iframe src="${urlComAutoplay}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      };

      function renderizarFeed() {
        const container = document.getElementById('feed-container');
        const paginationControls = document.getElementById('pagination-controls');
        const lista = subcategoriasAmador[abaAtual] || [];

        if (!container) return;

        if (lista.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#fff; padding: 20px; grid-column: 1/-1;">Nenhum conteúdo nesta aba.</p>';
          if (paginationControls) paginationControls.innerHTML = '';
          return;
        }

        const totalPaginas = Math.ceil(lista.length / ITENS_POR_PAGINA);
        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const fim = inicio + ITENS_POR_PAGINA;
        const itensPagina = lista.slice(inicio, fim);

        container.innerHTML = itensPagina.map(url => {
          if (abaAtual === 'fotos' || (typeof url === 'string' && url.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i))) {
            return `
              <div class="media-card">
                <img src="${url}" class="foto-galeria" loading="lazy" alt="Foto Galeria" />
              </div>
            `;
          } else {
            const thumbUrl = obterThumbnailBunny(url);
            
            if (thumbUrl) {
              return `
                <div class="media-card">
                  <div class="video-wrapper" onclick="iniciarPlayer(this, '${url}')">
                    <img src="${thumbUrl}" class="thumb" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<iframe src=\\'${url}\\' allowfullscreen loading=\\'lazy\\'></iframe>';" />
                    <div class="play-btn-overlay">▶</div>
                  </div>
                </div>
              `;
            } else {
              return `
                <div class="media-card">
                  <div class="video-wrapper">
                    <iframe src="${url}" allowfullscreen loading="lazy"></iframe>
                  </div>
                </div>
              `;
            }
          }
        }).join('');

        if (paginationControls && totalPaginas > 1) {
          let btnHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 20px 0;">`;
          
          if (paginaAtual > 1) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual - 1})">← Anterior</button>`;
          }
          
          btnHTML += `<span style="color:#fff; font-weight:bold;">Página ${paginaAtual} de ${totalPaginas}</span>`;

          if (paginaAtual < totalPaginas) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual + 1})">Próxima →</button>`;
          }
          
          btnHTML += `</div>`;
          paginationControls.innerHTML = btnHTML;
        } else if (paginationControls) {
          paginationControls.innerHTML = '';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.mudarPagina = function(novaPagina) {
        paginaAtual = novaPagina;
        renderizarFeed();
      };

      renderizarFeed();
    });
  </script>
</body>
</html>
