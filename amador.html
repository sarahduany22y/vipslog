<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Amador VIP 🔞</title>
  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    /* BOTOES DAS ABAS */
    .tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }

    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px;
      background: #17212b;
      color: #7f91a4;
      border: 1px solid #242f3d;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #202b36;
      color: #fff;
    }

    .tab-btn.active {
      background: #24a1de;
      color: #fff;
      border-color: #24a1de;
    }

    /* GRID RESPONSIVO */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 10px;
      max-width: 1000px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    @media (min-width: 900px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .video-grid {
        grid-template-columns: 1fr;
        padding: 5px;
      }
    }

    /* CARD INDIVIDUAL */
    .media-card {
      background: #17212b;
      border: 1px solid #242f3d;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* FOTOS DA GALERIA VIP */
    .media-card img.foto-galeria {
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: contain;
      background: #000;
      display: block;
    }
  </style>

  <!-- CARREGA A BIBLIOTECA DO SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>🔞Galeria Amador🔞</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- ABAS NAVEGÁVEIS -->
    <div class="tabs-container">
      <button id="tab-amador" class="tab-btn active" onclick="alternarAba('amador')">📹 Amador - vazados - incesto</button>
      <button id="tab-omegle" class="tab-btn" onclick="alternarAba('omegle')">🎥 OmegleDark</button>
      <button id="tab-funk" class="tab-btn" onclick="alternarAba('funk')">🔥 Funk Proibidão</button>
      <button id="tab-tiktok" class="tab-btn" onclick="alternarAba('tiktok')">🎵 TikTok +18</button>
      <button id="tab-fotos" class="tab-btn" onclick="alternarAba('fotos')">🖼️ Fotos + vazadas</button>
    </div>

    <!-- CONTAINER DE CONTEÚDO LIBERADO -->
    <div id="conteudo-liberado">
      <div id="feed-container" class="video-grid"></div>
      <div id="pagination-controls" class="pagination-container"></div>
    </div>

    <!-- MENSAGEM CASO O USUÁRIO NÃO TENHA ACESSO -->
    <div id="conteudo-bloqueado" style="display: none; text-align: center; color: #fff; padding: 40px 20px;">
      <h3>🔒 Conteúdo Exclusivo VIP</h3>
      <p style="margin: 10px 0 20px; color: #7f91a4;">Você precisa adquirir o acesso para visualizar esta galeria.</p>
      <a href="index.html" id="btn-comprar" class="tab-btn active" style="text-decoration: none; display: inline-block;">Adquirir Acesso</a>
    </div>
  </main>

  <!-- ARQUIVOS DE MÍDIA -->
  <script src="links-amador.js"></script>
  <script src="links-omegle.js"></script>
  <script src="links-funk.js"></script>
  <script src="links-tiktok.js"></script>
  <script src="links-flagras.js"></script>
  <script src="links-fotos-amador.js"></script>

  <!-- DEFINE A CATEGORIA CORRETA ANTES DO APP.JS -->
  <script>
    window.categoriaId = 'amador';
  </script>

  <!-- CARREGA O APP.JS COM SUPABASE -->
  <script src="app.js"></script>

  <!-- NAVEGAÇÃO E EXIBIÇÃO DOS VÍDEOS/FOTOS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const subcategoriasAmador = {
        amador: window.linksAmador || [],
        omegle: window.linksOmegle || [],
        funk: window.linksFunk || [],
        tiktok: window.linksTiktok || [],
        flagras: window.linksFlagras || [],
        fotos: window.linksFotosAmador || []
      };

      let abaAtual = 'amador';
      let paginaAtual = 1;
      const ITENS_POR_PAGINA = 10;

      window.alternarAba = function(subcat) {
        abaAtual = subcat;
        paginaAtual = 1;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const btnAtivo = document.getElementById(`tab-${subcat}`);
        if (btnAtivo) btnAtivo.classList.add('active');

        renderizarFeed();
      };

      function removerAutoplay(url) {
        if (typeof url !== 'string') return url;
        let urlLimpa = url.replace(/([?&])autoplay=true/g, '');
        urlLimpa = urlLimpa.replace(/([?&])autoplay=1/g, '');
        if (urlLimpa.includes('?')) {
          urlLimpa += '&autoplay=false';
        } else {
          urlLimpa += '?autoplay=false';
        }
        return urlLimpa;
      }

      function renderizarFeed() {
        const container = document.getElementById('feed-container');
        const paginationControls = document.getElementById('pagination-controls');
        const lista = subcategoriasAmador[abaAtual] || [];

        if (!container) return;

        if (lista.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#fff; padding: 20px; grid-column: 1/-1;">Nenhum conteúdo nesta aba.</p>';
          if (paginationControls) paginationControls.innerHTML = '';
          return;
        }

        const totalPaginas = Math.ceil(lista.length / ITENS_POR_PAGINA);
        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const fim = inicio + ITENS_POR_PAGINA;
        const itensPagina = lista.slice(inicio, fim);

        container.innerHTML = itensPagina.map(url => {
          if (abaAtual === 'fotos' || (typeof url === 'string' && url.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i))) {
            return `
              <div class="media-card">
                <img src="${url}" class="foto-galeria" loading="lazy" alt="Conteúdo VIP" />
              </div>
            `;
          } else {
            const urlSemPlay = removerAutoplay(url);
            return `
              <div class="media-card">
                <div class="video-wrapper">
                  <iframe src="${urlSemPlay}" loading="lazy" allow="accelerometer; gyroscope; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                </div>
              </div>
            `;
          }
        }).join('');

        if (paginationControls && totalPaginas > 1) {
          let btnHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 20px 0;">`;
          if (paginaAtual > 1) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual - 1})">← Anterior</button>`;
          }
          btnHTML += `<span style="color:#fff; font-weight:bold;">Página ${paginaAtual} de ${totalPaginas}</span>`;
          if (paginaAtual < totalPaginas) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual + 1})">Próxima →</button>`;
          }
          btnHTML += `</div>`;
          paginationControls.innerHTML = btnHTML;
        } else if (paginationControls) {
          paginationControls.innerHTML = '';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.mudarPagina = function(novaPagina) {
        paginaAtual = novaPagina;
        renderizarFeed();
      };

      renderizarFeed();
    });
  </script>
</body>
</html>
