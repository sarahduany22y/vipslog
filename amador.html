<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Amador VIP 🔞</title>
  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    /* Estilo responsivo para o seletor de múltiplas abas */
    .tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }

    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px;
      background: #17212b;
      color: #7f91a4;
      border: 1px solid #242f3d;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #202b36;
      color: #fff;
    }

    .tab-btn.active {
      background: #24a1de;
      color: #fff;
      border-color: #24a1de;
    }
  </style>

  <!-- TRAVA DE SEGURANÇA SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xjvkyofktqojuyequuxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__w-crANhzjiYKJuh2AX39w_Kz1-Rf74';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async function protegerAcesso() {
      document.documentElement.style.display = 'none';

      const { data: { session } } = await _supabase.auth.getSession();

      if (!session) {
        alert("Você precisa estar logado para acessar esta galeria.");
        window.location.href = 'index.html';
        return;
      }

      const { data: compras } = await _supabase
        .from('compras_usuario')
        .select('id')
        .eq('user_id', session.user.id)
        .eq('categoria_id', 'amador')
        .gt('data_expiracao', new Date().toISOString());

      if (!compras || compras.length === 0) {
        alert("Você não possui acesso a esta galeria ou seu plano expirou.");
        window.location.href = 'index.html';
        return;
      }

      document.documentElement.style.display = 'block';
    })();
  </script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>Galeria Amador 🔞</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- SELETOR DE MÚLTIPLAS ABAS -->
    <div class="tabs-container">
      <button id="tab-amador" class="tab-btn active" onclick="alternarAba('amador')">📹 Amador+Vazados+In6</button>
      <button id="tab-omegle" class="tab-btn" onclick="alternarAba('omegle')">🎥 Omegle</button>
      <button id="tab-funk" class="tab-btn" onclick="alternarAba('funk')">🔥 Funk Proibidão</button>
      <button id="tab-tiktok" class="tab-btn" onclick="alternarAba('tiktok')">🎵 TikTok +18</button>
      <button id="tab-flagras" class="tab-btn" onclick="alternarAba('flagras')">👀 Flagras Ruas</button>
      <button id="tab-fotos" class="tab-btn" onclick="alternarAba('fotos')">🖼️ Fotos</button>
    </div>

    <!-- Container do Feed -->
    <div id="feed-container" class="telegram-feed"></div>

    <!-- Controles de Paginação -->
    <div id="pagination-controls" class="pagination-container"></div>
  </main>

<!-- SCRIPTS DOS LINKS -->
  <script src="links-amador.js"></script>
  <script src="links-omegle.js"></script>
  <script src="links-funk.js"></script>
  <script src="links-tiktok.js"></script>
  <script src="links-flagras.js"></script>
  <script src="links-fotos-amador.js"></script>

  <!-- SCRIPT PRINCIPAL DA APLICAÇÃO -->
  <script src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mapeamento dos links
      const subcategoriasAmador = {
        amador: window.linksAmador || [],
        omegle: window.linksOmegle || [],
        funk: window.linksFunk || [],
        tiktok: window.linksTiktok || [],
        flagras: window.linksFlagras || [],
        fotos: window.linksFotosAmador || []
      };

      // Tenta usar a função do app.js
      if (typeof iniciarCategoriaMultiabas === 'function') {
        iniciarCategoriaMultiabas('amador', subcategoriasAmador);
      } else {
        // Fallback: se a função não existir no app.js, renderiza os vídeos amadores diretamente no container
        console.warn("A função iniciarCategoriaMultiabas não foi encontrada no app.js. Carregando vídeos diretamente...");
        
        const container = document.getElementById('feed-container');
        const lista = subcategoriasAmador.amador;

        if (container && lista.length > 0) {
          container.innerHTML = lista.map(url => `
            <div class="card-video" style="margin-bottom: 20px;">
              <iframe src="${url}" width="100%" height="450" frameborder="0" allowfullscreen></iframe>
            </div>
          `).join('');
        } else if (container) {
          container.innerHTML = '<p style="text-align:center; color:#fff;">Nenhum vídeo encontrado no links-amador.js.</p>';
        }
      }
    });
  </script>
