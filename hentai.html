<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Hentai VIP 🎨</title>
  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    /* ESTILIZAÇÃO DOS BOTÕES DE PAGINAÇÃO (ESTILO PRINT 2) */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
      width: 100%;
    }

    .paginacao-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      max-width: 900px;
    }

    .paginacao-wrapper a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      background-color: #1e293b; /* Fundo escuro dos botões */
      color: #7dd3fc;            /* Texto azul claro */
      text-decoration: none;
      border-radius: 8px;        /* Bordas arredondadas */
      font-size: 14px;
      font-weight: 500;
      border: 1px solid transparent;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .paginacao-wrapper a:hover {
      background-color: #334155;
      color: #ffffff;
    }

    .paginacao-wrapper a.active {
      background-color: #2563eb; /* Azul em destaque para o botão ativo */
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    .paginacao-wrapper a.disabled {
      opacity: 0.4;
      pointer-events: none;
      color: #64748b;
    }
  </style>

  <!-- TRAVA DE SEGURANÇA SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xjvkyofktqojuyequuxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__w-crANhzjiYKJuh2AX39w_Kz1-Rf74';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async function protegerAcesso() {
      // Oculta a página durante a verificação
      document.documentElement.style.display = 'none';

      const { data: { session } } = await _supabase.auth.getSession();

      if (!session) {
        alert("Você precisa estar logado para acessar esta galeria.");
        window.location.href = 'index.html';
        return;
      }

      // Verifica se comprou a categoria 'hentai' e se a assinatura tá ativa
      const { data: compras } = await _supabase
        .from('compras_usuario')
        .select('id')
        .eq('user_id', session.user.id)
        .eq('categoria_id', 'hentai')
        .gt('data_expiracao', new Date().toISOString());

      if (!compras || compras.length === 0) {
        alert("Você não possui acesso a esta galeria ou seu plano expirou.");
        window.location.href = 'index.html';
        return;
      }

      // Libera a exibição
      document.documentElement.style.display = 'block';
    })();
  </script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>Coleção Hentai 🎨</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- Seletor de Abas -->
    <div class="tabs-container">
      <button id="tab-videos" class="tab-btn active" onclick="alternarAba('videos')">📹 Vídeos</button>
      <button id="tab-fotos" class="tab-btn" onclick="alternarAba('fotos')">🖼️ Fotos</button>
    </div>

    <!-- Container do Feed -->
    <div id="feed-container" class="telegram-feed"></div>

    <!-- Controles de Paginação -->
    <div id="pagination-controls" class="pagination-container"></div>
  </main>

  <!-- SCRIPTS DOS LINKS DE HENTAI -->
  <script src="links-hentai.js"></script> 
  <script src="links-fotos-hentai.js"></script>

  <!-- SCRIPT DE PAGINAÇÃO ILIMITADA E GERENCIAMENTO DE ABAS -->
  <script>
    // Quantidade de mídias por página
    const ITENS_POR_PAGINA = 12;

    // Estado da aplicação
    let abaAtual = 'videos';
    let paginaAtual = 1;

    // Inicializa quando o documento carrega
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      abaAtual = urlParams.get('aba') || 'videos';
      paginaAtual = parseInt(urlParams.get('pagina')) || 1;

      carregarConteudo();
    });

    // Alterna entre as abas Vídeos e Fotos
    function alternarAba(novaAba) {
      abaAtual = novaAba;
      paginaAtual = 1;
      window.history.pushState({}, '', `?aba=${abaAtual}&pagina=${paginaAtual}`);
      carregarConteudo();
    }

    // Ir para uma página específica
    function irParaPagina(e, numeroPagina) {
      if (e) e.preventDefault();
      paginaAtual = numeroPagina;
      window.history.pushState({}, '', `?aba=${abaAtual}&pagina=${paginaAtual}`);
      carregarConteudo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Carrega e renderiza mídias + paginação
    function carregarConteudo() {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const abaAtivaBtn = document.getElementById(`tab-${abaAtual}`);
      if (abaAtivaBtn) abaAtivaBtn.classList.add('active');

      let listaMidias = [];
      if (abaAtual === 'videos') {
        listaMidias = window.linksHentai || [];
      } else if (abaAtual === 'fotos') {
        listaMidias = window.linksFotosHentai || [];
      }

      const containerFeed = document.getElementById('feed-container');
      containerFeed.innerHTML = '';

      if (!listaMidias || listaMidias.length === 0) {
        containerFeed.innerHTML = '<p class="sem-midia">Nenhuma mídia encontrada nesta categoria.</p>';
        document.getElementById('pagination-controls').innerHTML = '';
        return;
      }

      // Cálculo de Paginação Ilimitada
      const totalItens = listaMidias.length;
      const totalPaginas = Math.ceil(totalItens / ITENS_POR_PAGINA);

      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
      if (paginaAtual < 1) paginaAtual = 1;

      const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
      const fim = inicio + ITENS_POR_PAGINA;
      const itensPagina = listaMidias.slice(inicio, fim);

      // Renderiza as mídias
      itensPagina.forEach(item => {
        const elementoMidia = document.createElement('div');
        elementoMidia.className = 'midia-card';

        const url = typeof item === 'string' ? item : (item.link || item.url || '');
        const titulo = item.titulo || item.nome || 'Mídia VIP';

        if (abaAtual === 'videos') {
          elementoMidia.innerHTML = `
            <div class="video-wrapper">
              <iframe src="${url}" frameborder="0" allowfullscreen></iframe>
            </div>
            <p class="midia-titulo">${titulo}</p>
          `;
        } else {
          elementoMidia.innerHTML = `
            <div class="foto-wrapper">
              <img src="${url}" alt="${titulo}" loading="lazy" />
            </div>
            <p class="midia-titulo">${titulo}</p>
          `;
        }

        containerFeed.appendChild(elementoMidia);
      });

      renderizarPaginacao(totalPaginas);
    }

    // Renderiza a régua de botões igual ao Print 2
    function renderizarPaginacao(totalPaginas) {
      const containerPaginacao = document.getElementById('pagination-controls');
      containerPaginacao.innerHTML = '';

      if (totalPaginas <= 1) return;

      let htmlPaginacao = '<div class="paginacao-wrapper">';

      // Botão Anterior
      if (paginaAtual > 1) {
        htmlPaginacao += `<a href="#" onclick="irParaPagina(event, ${paginaAtual - 1})">« Anterior</a>`;
      } else {
        htmlPaginacao += `<a class="disabled">« Anterior</a>`;
      }

      // Gera todos os números sem limite fixo
      for (let i = 1; i <= totalPaginas; i++) {
        const classeAtivo = i === paginaAtual ? 'active' : '';
        htmlPaginacao += `<a href="#" class="${classeAtivo}" onclick="irParaPagina(event, ${i})">${i}</a>`;
      }

      // Botão Próxima
      if (paginaAtual < totalPaginas) {
        htmlPaginacao += `<a href="#" onclick="irParaPagina(event, ${paginaAtual + 1})">Próxima »</a>`;
      } else {
        htmlPaginacao += `<a class="disabled">Próxima »</a>`;
      }

      htmlPaginacao += '</div>';
      containerPaginacao.innerHTML = htmlPaginacao;
    }
  </script>
</body>
</html>
