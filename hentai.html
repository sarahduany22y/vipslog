<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria Hentai VIP 🎨</title>

  <!-- FAVICON INLINE -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2324a1de%22/><text y=%22.9em%22 x=%2220%22 font-size=%2270%22 fill=%22white%22>🔞</text></svg>">

  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    /* BOTOES E NAVEGACAO DE PAGINAS */
    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px;
      background: #17212b;
      color: #7f91a4;
      border: 1px solid #242f3d;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #202b36;
      color: #fff;
    }

    .tab-btn.active {
      background: #24a1de;
      color: #fff;
      border-color: #24a1de;
    }

    /* GRID RESPONSIVO */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 10px;
      max-width: 1000px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    @media (min-width: 900px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .video-grid {
        grid-template-columns: 1fr;
        padding: 5px;
      }
    }

    /* CARD INDIVIDUAL */
    .media-card {
      background: #17212b;
      border: 1px solid #242f3d;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .media-card img.foto-galeria {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
      width: 100%;
    }
  </style>

  <!-- CARREGA A BIBLIOTECA DO SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>Coleção Hentai 🎨</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- CONTAINER DE CONTEÚDO LIBERADO -->
    <div id="conteudo-liberado">
      <div id="feed-container" class="video-grid"></div>
      <div id="pagination-controls" class="pagination-container"></div>
    </div>

    <!-- MENSAGEM CASO O USUÁRIO NÃO TENHA ACESSO -->
    <div id="conteudo-bloqueado" style="display: none; text-align: center; color: #fff; padding: 40px 20px;">
      <h3>🔒 Conteúdo Exclusivo VIP</h3>
      <p style="margin: 10px 0 20px; color: #7f91a4;">Você precisa adquirir o acesso para visualizar esta galeria.</p>
      <a href="index.html" id="btn-comprar" class="tab-btn active" style="text-decoration: none; display: inline-block;">Adquirir Acesso</a>
    </div>
  </main>

  <!-- SCRIPTS DOS LINKS DE HENTAI -->
  <script src="links-hentai.js"></script>

  <!-- DEFINE A CATEGORIA CORRETA ANTES DO APP.JS -->
  <script>
    window.categoriaId = 'hentai';
  </script>

  <!-- CARREGA O APP.JS COM SUPABASE -->
  <script src="app.js"></script>

  <!-- NAVEGAÇÃO E EXIBIÇÃO DOS VÍDEOS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let paginaAtual = 1;
      const ITENS_POR_PAGINA = 10;

      // Desativa a reprodução automática e força o autoplay=false
      function removerAutoplay(url) {
        if (typeof url !== 'string') return url;
        let urlLimpa = url.replace(/([?&])autoplay=true/g, '');
        urlLimpa = urlLimpa.replace(/([?&])autoplay=1/g, '');
        if (urlLimpa.includes('?')) {
          urlLimpa += '&autoplay=false';
        } else {
          urlLimpa += '?autoplay=false';
        }
        return urlLimpa;
      }

      function renderizarFeed() {
        const container = document.getElementById('feed-container');
        const paginationControls = document.getElementById('pagination-controls');
        const lista = window.linksHentai || [];

        if (!container) return;

        if (lista.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#fff; padding: 20px; grid-column: 1/-1;">Nenhum conteúdo encontrado nesta categoria.</p>';
          if (paginationControls) paginationControls.innerHTML = '';
          return;
        }

        const totalPaginas = Math.ceil(lista.length / ITENS_POR_PAGINA);
        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const fim = inicio + ITENS_POR_PAGINA;
        const itensPagina = lista.slice(inicio, fim);

        container.innerHTML = itensPagina.map(item => {
          const url = typeof item === 'string' ? item : (item.link || item.url || '');
          
          if (typeof url === 'string' && url.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i)) {
            return `
              <div class="media-card">
                <img src="${url}" class="foto-galeria" loading="lazy" alt="Hentai Galeria" />
              </div>
            `;
          } else {
            const urlSemPlay = removerAutoplay(url);
            return `
              <div class="media-card">
                <div class="video-wrapper">
                  <iframe src="${urlSemPlay}" loading="lazy" allow="accelerometer; gyroscope; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                </div>
              </div>
            `;
          }
        }).join('');

        if (paginationControls && totalPaginas > 1) {
          let btnHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 20px 0;">`;
          if (paginaAtual > 1) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual - 1})">← Anterior</button>`;
          }
          btnHTML += `<span style="color:#fff; font-weight:bold;">Página ${paginaAtual} de ${totalPaginas}</span>`;
          if (paginaAtual < totalPaginas) {
            btnHTML += `<button class="tab-btn" onclick="mudarPagina(${paginaAtual + 1})">Próxima →</button>`;
          }
          btnHTML += `</div>`;
          paginationControls.innerHTML = btnHTML;
        } else if (paginationControls) {
          paginationControls.innerHTML = '';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.mudarPagina = function(novaPagina) {
        paginaAtual = novaPagina;
        renderizarFeed();
      };

      renderizarFeed();
    });
  </script>
</body>
</html>
